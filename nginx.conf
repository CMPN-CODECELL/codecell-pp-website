server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  # /team/ -> /team (one canonical URL per page; mirrors deploy/cloudfront-url-rewrite.js)
  rewrite ^/(.+)/$ /$1 permanent;

  # HTML: browsers revalidate, the CDN holds it for 5 minutes so deploys show up quickly.
  location = / {
    add_header Cache-Control "public, max-age=0, s-maxage=300";
    try_files /index.html =404;
  }

  location / {
    # The export writes /team as team.html, so serve the clean URL.
    add_header Cache-Control "public, max-age=0, s-maxage=300";
    try_files $uri $uri.html =404;
  }

  # Hashed build assets never change.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Images, fonts and 3D models are not content-hashed: cache for a day.
  location ~* \.(webp|png|jpe?g|svg|ico|gif|woff2?|ttf|glb|gltf|mp4)$ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  gzip on;
  gzip_static on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  error_page 404 /404.html;
}
