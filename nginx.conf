server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  # /team/ -> /team (one canonical URL per page; mirrors deploy/cloudfront-url-rewrite.js)
  rewrite ^/(.+)/$ /$1 permanent;

  # HTML: browsers revalidate, the CDN holds it for 5 minutes so deploys show up quickly.
  location = / {
    add_header Cache-Control "public, max-age=0, s-maxage=300";
    try_files /index.html =404;
  }

  location / {
    # The export writes /team as team.html, so serve the clean URL.
    add_header Cache-Control "public, max-age=0, s-maxage=300";
    try_files $uri $uri.html =404;
  }

  # Hashed build assets never change.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Images, fonts and 3D models are not content-hashed: cache for a day.
  location ~* \.(webp|png|jpe?g|svg|ico|gif|woff2?|ttf|glb|gltf|bin|mp4)$ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # nginx has no type for .glb; without one it goes out as octet-stream.
  include /etc/nginx/mime.types;
  types { model/gltf-binary glb; model/gltf+json gltf; }

  # gzip_static serves the .gz files the Dockerfile writes; gzip covers the rest.
  # gzip_proxied any: every request arrives via the load balancer ("Via: 1.1 google"),
  # and nginx's default (off) would skip compression for all of them.
  # gzip_vary: the CDN must keep compressed and uncompressed copies apart.
  gzip on;
  gzip_static on;
  gzip_proxied any;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types text/plain text/css text/xml application/javascript application/json
             application/xml application/manifest+json image/svg+xml font/ttf
             model/gltf-binary model/gltf+json application/octet-stream;

  error_page 404 /404.html;
}
